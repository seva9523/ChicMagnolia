name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: Chic Magnolia <test@example.com>

    steps:
      - name: Check out the brand branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sprint-7-brand-spacing
          fetch-depth: 0

      - name: Apply the final customer-facing name correction
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          content = content.replace('`ChicMagnolia Monthly`', '`Chic Magnolia Monthly`')
          readme.write_text(content, encoding='utf-8')
          Path('.brand-spacing-codemod-complete').write_text(
              'Temporary marker. Delete after the generated commit is verified.\n',
              encoding='utf-8',
          )
          PY

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 10

              env:
                NEXT_PUBLIC_APP_URL: http://localhost:3000
                NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
                NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
                SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
                STRIPE_SECRET_KEY: sk_test_placeholder
                STRIPE_WEBHOOK_SECRET: whsec_placeholder
                RESEND_API_KEY: re_placeholder
                EMAIL_FROM: Chic Magnolia <test@example.com>

              steps:
                - name: Check out repository
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

                - name: Validate shell script syntax
                  run: |
                    bash -n scripts/production-smoke.sh
                    bash -n scripts/verify-encrypted-backup.sh
                    bash -n scripts/restore-backup-locally.sh

                - name: Set up Node.js
                  uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: package-lock.json

                - name: Install locked dependencies
                  run: npm ci --no-audit --no-fund

                - name: Verify formatting
                  run: npm run format:check

                - name: Lint
                  run: npm run lint

                - name: Type check
                  run: npm run typecheck

                - name: Test
                  run: npm test

                - name: Build
                  run: npm run build
          YAML

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format the generated changes
        run: npm run format

      - name: Commit the final generated correction
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Finish the Chic Magnolia brand correction'
          git push origin HEAD:sprint-7-brand-spacing

      - name: Audit remaining compact-name occurrences
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude='package-lock.json' \
            'ChicMagnolia' . || true

      - name: Validate shell script syntax
        run: |
          bash -n scripts/production-smoke.sh
          bash -n scripts/verify-encrypted-backup.sh
          bash -n scripts/restore-backup-locally.sh

      - name: Verify formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
