name: CI

on:
  push:
    branches: [sprint-7-private-beta-access]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: Chic Magnolia <test@example.com>

    steps:
      - name: Check out the private beta branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sprint-7-private-beta-access
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format private beta files
        run: |
          npx prettier --write \
            scripts/create-beta-invite.mjs \
            src/app/auth/actions.ts \
            src/app/dashboard/page.tsx \
            src/components/auth/auth-form.test.tsx \
            src/components/auth/auth-form.tsx \
            src/services/monitoring-access.test.ts

      - name: Commit formatted files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo 'No formatting changes were required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              scripts/create-beta-invite.mjs \
              src/app/auth/actions.ts \
              src/app/dashboard/page.tsx \
              src/components/auth/auth-form.test.tsx \
              src/components/auth/auth-form.tsx \
              src/services/monitoring-access.test.ts
            git commit -m 'Format private beta access files'
            git push origin HEAD:sprint-7-private-beta-access
          fi

      - name: Validate shell script syntax
        run: |
          bash -n scripts/production-smoke.sh
          bash -n scripts/verify-encrypted-backup.sh
          bash -n scripts/restore-backup-locally.sh

      - name: Verify formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
