name: Production smoke

on:
  push:
    branches:
      - main
  schedule:
    - cron: '11 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate smoke script syntax
        run: bash -n scripts/production-smoke.sh

      - name: Verify canonical production
        shell: bash
        env:
          APP_URL: https://www.chicmagnolia.com
        run: |
          set -euo pipefail

          expected_release=''
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            expected_release="${GITHUB_SHA}"
          fi

          bash scripts/production-smoke.sh "${APP_URL}" "${expected_release}"
