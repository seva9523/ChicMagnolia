name: Format sources once

on:
  push:
    branches:
      - sprint-7-pin-dependencies
    paths:
      - .github/workflows/format-sources-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sprint-7-pin-dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format repository
        run: npm run format

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format repository for strict CI"
          git push origin HEAD:sprint-7-pin-dependencies
