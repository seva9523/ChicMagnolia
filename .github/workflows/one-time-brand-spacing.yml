name: Apply Chic Magnolia brand spacing

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-brand-spacing:
    if: github.head_ref == 'sprint-7-brand-spacing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sprint-7-brand-spacing
          fetch-depth: 0

      - name: Replace the user-facing product name
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          unspaced = re.compile(
              r'(?<![A-Za-z0-9_./-])ChicMagnolia(?![A-Za-z0-9_./-])'
          )
          text_extensions = {'.ts', '.tsx', '.md', '.mdx', '.html', '.txt'}
          ignored_parts = {'.git', '.next', 'node_modules', 'coverage'}
          changed: list[str] = []

          def replace_markdown(content: str) -> str:
              lines = content.splitlines(keepends=True)
              in_fence = False
              fence_marker = ''
              output: list[str] = []

              for line in lines:
                  stripped = line.lstrip()
                  if stripped.startswith('```') or stripped.startswith('~~~'):
                      marker = stripped[:3]
                      if not in_fence:
                          in_fence = True
                          fence_marker = marker
                      elif marker == fence_marker:
                          in_fence = False
                          fence_marker = ''
                      output.append(line)
                      continue

                  output.append(line if in_fence else unspaced.sub('Chic Magnolia', line))

              return ''.join(output)

          for path in root.rglob('*'):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue

              should_process = path.suffix in text_extensions or path.name == '.env.example'
              if not should_process:
                  continue

              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              if path.suffix in {'.md', '.mdx'}:
                  updated = replace_markdown(original)
              else:
                  updated = unspaced.sub('Chic Magnolia', original)

              if path.name == '.env.example':
                  updated = updated.replace(
                      'EMAIL_FROM=ChicMagnolia <',
                      'EMAIL_FROM=Chic Magnolia <',
                  )

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          regression_test = root / 'src/security/brand-name.test.ts'
          regression_test.write_text(
              """import { readFileSync, readdirSync, statSync } from 'node:fs';
import { join, relative } from 'node:path';

import { describe, expect, it } from 'vitest';

const repositoryRoot = process.cwd();
const sourceRoot = join(repositoryRoot, 'src');
const unspacedBrand = ['Chic', 'Magnolia'].join('');
const standaloneBrandPattern = new RegExp(
  `(?<![A-Za-z0-9_./-])${unspacedBrand}(?![A-Za-z0-9_./-])`,
);

function sourceFiles(directory: string): string[] {
  return readdirSync(directory).flatMap((entry) => {
    const path = join(directory, entry);
    const metadata = statSync(path);
    if (metadata.isDirectory()) return sourceFiles(path);
    return /\\.(?:ts|tsx)$/.test(entry) ? [path] : [];
  });
}

describe('product branding', () => {
  it('uses the spaced Chic Magnolia name in user-facing source', () => {
    const violations = sourceFiles(sourceRoot)
      .filter((path) => !path.endsWith('brand-name.test.ts'))
      .filter((path) => standaloneBrandPattern.test(readFileSync(path, 'utf8')))
      .map((path) => relative(repositoryRoot, path));

    expect(violations).toEqual([]);
  });

  it('uses the spaced name in the public email sender example', () => {
    const environmentExample = readFileSync(
      join(repositoryRoot, '.env.example'),
      'utf8',
    );

    expect(environmentExample).toContain('EMAIL_FROM=Chic Magnolia <');
  });
});
""",
              encoding='utf-8',
          )
          changed.append(regression_test.as_posix())

          print('Updated user-facing brand name in:')
          for path in sorted(set(changed)):
              print(f'- {path}')
          PY

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository formatting
        run: npm run format

      - name: Commit the brand correction
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo 'No brand-spacing changes were required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Use Chic Magnolia as the user-facing brand name'
          git push origin HEAD:sprint-7-brand-spacing
