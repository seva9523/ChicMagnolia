name: Daily price monitoring

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_URL: ${{ secrets.CHICMAGNOLIA_APP_URL }}
      CRON_SECRET: ${{ secrets.CHICMAGNOLIA_CRON_SECRET }}

    steps:
      - name: Run due price checks
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::warning::Daily monitoring is not configured. Add CHICMAGNOLIA_APP_URL and CHICMAGNOLIA_CRON_SECRET repository secrets."
            exit 0
          fi

          endpoint="${APP_URL%/}/api/cron/daily-price-check"

          # The endpoint handles three purchases per request. Fifty batches cover up
          # to 150 active purchases daily, which is sufficient for the first-user beta.
          for batch in $(seq 1 50); do
            echo "Running monitoring batch ${batch}..."
            response_file=$(mktemp)

            if ! http_code=$(curl \
              --silent \
              --show-error \
              --max-time 65 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json" \
              "${endpoint}"); then
              echo "::warning::Monitoring request did not complete. Retrying with the next batch."
              rm -f "${response_file}"
              sleep 5
              continue
            fi

            response=$(cat "${response_file}")
            rm -f "${response_file}"

            if [ "${http_code}" = "502" ] || [ "${http_code}" = "504" ] || [ "${http_code}" = "429" ]; then
              echo "::warning::Monitoring endpoint returned HTTP ${http_code}. It may have partially completed; continuing safely."
              sleep 5
              continue
            fi

            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "${response}"
              echo "::error::Monitoring endpoint returned HTTP ${http_code}."
              exit 1
            fi

            echo "${response}" | jq .
            processed=$(echo "${response}" | jq -r '.processed // 0')
            remaining=$(echo "${response}" | jq -r '.remaining // 0')

            if [ "${processed}" -eq 0 ] || [ "${remaining}" -eq 0 ]; then
              echo "Daily monitoring complete."
              break
            fi

            sleep 3
          done
